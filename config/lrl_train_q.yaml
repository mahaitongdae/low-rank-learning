task: train_qnet_only
normalize_data: true

device: cuda
dataset_name: mujoco_halfcheetah_simple
# Example for multiple datasets (commented out by default):
# dataset_names:
#   - mujoco/halfcheetah/simple-v0
#   - mujoco/halfcheetah/medium-v0
#   - mujoco/halfcheetah/expert-v0
train_batch_size: 1
train_batches_per_epoch: 2048
train_epochs: 10
lr: 0.0003
logger: wandb
sigma: 4.0
seed: 0
suffix: default
td_n_horizon: 3

# policy training (optional)
train_policy: false
actor_lr: 0.0003
policy_alpha: 0.2
policy_hidden_dim: 256
policy_hidden_depth: 2
log_std_bounds: [-5.0, 2.0]

# model
feature_dim: 1024
hidden_depth: 3
hidden_dim: 512

# load
pretrained_representation_path: /home/haitong/PycharmProjects/low_rank_learning/log/minari_halfcheetah_simple-v0/random_feature/2025-10-27_20-46-46_s0_default
# pretrained_representation_path: /Users/mahaitong/Dropbox (Harvard University)/data/low_rank_learning/pretrained/repr/2025-10-27_20-46-46_s0_default

defaults:
 - _self_
 - estimator: random_feature

hydra:
  run:
    dir: ./log/${dataset_name}/${estimator.name}_qnet/${now:%Y-%m-%d_%H-%M-%S}_s${seed}_fdim${feature_dim}_tdn${td_n_horizon}_${suffix} # wlayer${estimator.w_hidden_activation}_
  job:
    chdir: true