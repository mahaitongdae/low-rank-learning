[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "low-rank-learning"
version = "0.1.0"
description = "Research code for low-rank learning and imitation/EBM experiments"
readme = "readme.md"
requires-python = ">=3.9"
authors = [{ name = "Haitong" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
packages = { find = { include = ["agents*", "envs*", "utilities*", "networks*"], exclude = ["datasets*", "dataset*", "log*", "nbs*", "*.ipynb", "config*", "scripts*"] } }
py-modules = ["utils", "buffer", "evaluation"]
